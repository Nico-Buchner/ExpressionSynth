# Two workflows, deliberately separate.
#
# Run `compile-check` FIRST. It needs no Apple Developer account, no
# certificates, and no App Store Connect setup — it only answers "does
# this C++ actually build for iOS?". Getting that green before touching
# signing removes most of the variables from the harder problem, and
# costs a fraction of the build minutes to iterate on.
#
# Only once compile-check passes, run `ios-testflight`.

definitions:
  juce_version: &juce_version "8.0.12"   # verify against github.com/juce-framework/JUCE/tags
  ios_deployment_target: &ios_target "16.0"

workflows:

  # ---------------------------------------------------------------
  # 1. Compile check — no signing, no Apple account needed
  # ---------------------------------------------------------------
  compile-check:
    name: Compile Check (unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        JUCE_VERSION: *juce_version
        IOS_DEPLOYMENT_TARGET: *ios_target
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Fetch JUCE
        script: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git JUCE
          echo "JUCE at: $(cd JUCE && git describe --tags)"

      - name: Configure (CMake -> Xcode project)
        script: |
          # Start clean. A build directory configured for a different
          # platform will keep its cached settings and silently ignore
          # the flags below.
          rm -rf build-ios

          # CMAKE_SYSTEM_NAME alone is documented to be enough, but in
          # practice CMake can still resolve the macOS SDK and emit a
          # macOS-only project. Setting the sysroot and architecture
          # explicitly removes the ambiguity.
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"

      - name: Verify the project actually targets iOS
        script: |
          # Fail here with a clear message rather than several steps
          # later with an opaque "no matching destination" error.
          echo "--- platform settings in CMakeCache ---"
          grep -E "CMAKE_SYSTEM_NAME|CMAKE_OSX_SYSROOT|CMAKE_OSX_ARCHITECTURES|CMAKE_OSX_DEPLOYMENT_TARGET" \
            build-ios/CMakeCache.txt || true

          if ! grep -q "CMAKE_OSX_SYSROOT:.*iphoneos" build-ios/CMakeCache.txt; then
            echo ""
            echo "ERROR: CMake did not configure for iOS."
            echo "The generated project would build for macOS instead."
            exit 1
          fi
          echo "OK — project is configured for iOS."

      - name: List generated targets and destinations
        script: |
          echo "--- targets and schemes ---"
          xcodebuild -project build-ios/ExpressionSynth.xcodeproj -list
          echo ""
          echo "--- destinations for the Standalone scheme ---"
          # -showdestinations tells us what platforms the scheme really
          # supports, which is exactly what the previous failure needed.
          xcodebuild -project build-ios/ExpressionSynth.xcodeproj \
            -scheme ExpressionSynth_Standalone -showdestinations || true

      - name: Build (unsigned)
        script: |
          # Driving the build through CMake rather than calling xcodebuild
          # directly: CMake already knows the platform it configured for,
          # so there is no second place for the target platform to be
          # stated and disagree.
          cmake --build build-ios \
            --config Release \
            --target ExpressionSynth_Standalone \
            -- -sdk iphoneos \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY=""

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your.email@example.com   # replace; get build results without watching
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # 2. Signed build -> TestFlight -> iPad
  # ---------------------------------------------------------------
  ios-testflight:
    name: iOS AUv3 -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key as saved in Codemagic UI
      # (Teams > Integrations > Developer Portal).
      app_store_connect: codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: me.buchner.expressionsynth
      vars:
        JUCE_VERSION: *juce_version
        IOS_DEPLOYMENT_TARGET: *ios_target
        BUNDLE_ID_CONTAINER: "me.buchner.expressionsynth"
        BUNDLE_ID_AUV3: "me.buchner.expressionsynth.auv3"
        APP_STORE_APPLE_ID: "6798476846"
      groups:
        - appstore_credentials   # must contain DEVELOPMENT_TEAM
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Fetch JUCE
        script: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git JUCE

      - name: Set build number
        script: |
          # App Store Connect rejects a build number it has seen before,
          # so derive the next one rather than hardcoding.
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          echo "Using build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Configure (CMake -> Xcode project)
        script: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"

      - name: Verify the project actually targets iOS
        script: |
          grep -E "CMAKE_SYSTEM_NAME|CMAKE_OSX_SYSROOT|CMAKE_OSX_ARCHITECTURES" \
            build-ios/CMakeCache.txt || true
          if ! grep -q "CMAKE_OSX_SYSROOT:.*iphoneos" build-ios/CMakeCache.txt; then
            echo "ERROR: CMake did not configure for iOS."
            exit 1
          fi

      - name: Check the app icon is present
        script: |
          # A missing icon fails at upload rather than at build, which
          # wastes the whole signing run.
          if [ ! -f Resources/icon.png ]; then
            echo "ERROR: Resources/icon.png is missing."
            echo "App Store Connect will reject the upload without it."
            exit 1
          fi
          echo "icon present: $(ls -la Resources/icon.png)"

      - name: Fetch signing files
        script: |
          keychain initialize
          # Both the container app AND the extension need provisioning
          # profiles — the extension is a separate signed binary.
          app-store-connect fetch-signing-files "$BUNDLE_ID_CONTAINER" \
            --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$BUNDLE_ID_AUV3" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build and archive
        script: |
          xcode-project build-ipa \
            --project "build-ios/ExpressionSynth.xcodeproj" \
            --scheme "ExpressionSynth_Standalone" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
