# Two workflows, deliberately separate.
#
# Run `compile-check` FIRST. It needs no Apple Developer account, no
# certificates, and no App Store Connect setup - it only answers "does
# this C++ actually build for iOS?". Getting that green before touching
# signing removes most of the variables from the harder problem, and
# costs a fraction of the build minutes to iterate on.
#
# Only once compile-check passes, run `ios-testflight`.

definitions:
  juce_version: &juce_version "8.0.12"   # verify against github.com/juce-framework/JUCE/tags
  ios_deployment_target: &ios_target "16.0"

workflows:

  # ---------------------------------------------------------------
  # 1. Compile check - no signing, no Apple account needed
  # ---------------------------------------------------------------
  compile-check:
    name: Compile Check (unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        JUCE_VERSION: *juce_version
        IOS_DEPLOYMENT_TARGET: *ios_target
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Fetch JUCE
        script: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git JUCE
          echo "JUCE at: $(cd JUCE && git describe --tags)"

      - name: Configure (CMake -> Xcode project)
        script: |
          # Start clean. A build directory configured for a different
          # platform will keep its cached settings and silently ignore
          # the flags below.
          rm -rf build-ios

          # CMAKE_SYSTEM_NAME alone is documented to be enough, but in
          # practice CMake can still resolve the macOS SDK and emit a
          # macOS-only project. Setting the sysroot and architecture
          # explicitly removes the ambiguity.
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"

      - name: Verify the project actually targets iOS
        script: |
          # Fail here with a clear message rather than several steps
          # later with an opaque "no matching destination" error.
          echo "--- platform settings in CMakeCache ---"
          grep -E "CMAKE_SYSTEM_NAME|CMAKE_OSX_SYSROOT|CMAKE_OSX_ARCHITECTURES|CMAKE_OSX_DEPLOYMENT_TARGET" \
            build-ios/CMakeCache.txt || true

          if ! grep -q "CMAKE_OSX_SYSROOT:.*iphoneos" build-ios/CMakeCache.txt; then
            echo ""
            echo "ERROR: CMake did not configure for iOS."
            echo "The generated project would build for macOS instead."
            exit 1
          fi
          echo "OK - project is configured for iOS."

      - name: List generated targets and destinations
        script: |
          echo "--- targets and schemes ---"
          xcodebuild -project build-ios/ExpressionSynth.xcodeproj -list
          echo ""
          echo "--- destinations for the Standalone scheme ---"
          # -showdestinations tells us what platforms the scheme really
          # supports, which is exactly what the previous failure needed.
          xcodebuild -project build-ios/ExpressionSynth.xcodeproj \
            -scheme ExpressionSynth_Standalone -showdestinations || true

      - name: Build (unsigned)
        script: |
          # Driving the build through CMake rather than calling xcodebuild
          # directly: CMake already knows the platform it configured for,
          # so there is no second place for the target platform to be
          # stated and disagree.
          cmake --build build-ios \
            --config Release \
            --target ExpressionSynth_Standalone \
            -- -sdk iphoneos \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY=""

      - name: Report the bundle identifiers JUCE generated
        script: |
          # Read them out of the built bundles rather than assuming. The
          # extension's identifier is derived by JUCE, and it has to match
          # what is registered in the developer portal exactly.
          APP=$(find build-ios -name "*.app" -maxdepth 6 -type d | head -1)
          echo "=================================================="
          echo "REGISTER THESE EXACTLY IN THE APPLE PORTAL:"
          echo "=================================================="
          echo -n "  container App ID : "
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          for EXT in "$APP"/PlugIns/*.appex; do
            echo -n "  extension App ID : "
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXT/Info.plist"
          done
          echo -n "  App Group        : "
          grep -rho 'group\.[a-zA-Z0-9._-]*' build-ios --include="*.entitlements" \
            2>/dev/null | head -1 || echo "(none found)"
          echo "=================================================="

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your.email@example.com   # replace; get build results without watching
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # 2. Signed build -> TestFlight -> iPad
  # ---------------------------------------------------------------
  ios-testflight:
    name: iOS AUv3 -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key as saved in Codemagic UI
      # (Teams > Integrations > Developer Portal).
      app_store_connect: Codemagic
    environment:
      xcode: latest
      # No ios_signing block here on purpose. That enables Codemagic's
      # automatic signing, which runs before any script and only FETCHES
      # existing profiles - it will not create them. The explicit
      # fetch-signing-files step below does create them, but never got
      # the chance while automatic signing was failing first.
      vars:
        JUCE_VERSION: *juce_version
        IOS_DEPLOYMENT_TARGET: *ios_target
        BUNDLE_ID_CONTAINER: "me.buchner.expressionsynth"
        BUNDLE_ID_AUV3: "me.buchner.expressionsynth.expressionsynthAUv3"
        APP_STORE_APPLE_ID: "6798476846"
      groups:
        # Must contain DEVELOPMENT_TEAM and CERTIFICATE_PRIVATE_KEY_B64.
        - appstore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Fetch JUCE
        script: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git JUCE

      - name: Set build number
        script: |
          # App Store Connect rejects a build number it has seen before,
          # so derive the next one rather than hardcoding.
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          echo "Using build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Configure (CMake -> Xcode project)
        script: |
          # Identical to the compile-check workflow on purpose. These two
          # steps were previously written out separately, only one was
          # corrected when the platform flags were fixed, and the other
          # carried the fault silently until it first ran.
          rm -rf build-ios
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"

      - name: Verify the project actually targets iOS
        script: |
          grep -E "CMAKE_SYSTEM_NAME|CMAKE_OSX_SYSROOT|CMAKE_OSX_ARCHITECTURES" \
            build-ios/CMakeCache.txt || true
          if ! grep -q "CMAKE_OSX_SYSROOT:.*iphoneos" build-ios/CMakeCache.txt; then
            echo "ERROR: CMake did not configure for iOS."
            exit 1
          fi

      - name: Check the app icon is present
        script: |
          # A missing icon fails at upload rather than at build, which
          # wastes the whole signing run.
          if [ ! -f Resources/icon.png ]; then
            echo "ERROR: Resources/icon.png is missing."
            echo "App Store Connect will reject the upload without it."
            exit 1
          fi
          echo "icon present: $(ls -la Resources/icon.png)"

      - name: Fetch signing files
        script: |
          set -e

          if [ -z "$CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY_B64 is not set."
            echo "Add it to the appstore_credentials environment group."
            exit 1
          fi

          # The key is carried base64-encoded rather than as raw PEM.
          # A PEM is multi-line, and pasting multi-line text into a web
          # form loses or rewrites the newlines often enough that it is
          # not worth relying on. Base64 is a single line of characters
          # nothing will alter.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" \
            | openssl base64 -d -A > /tmp/cert_key.pem

          # Headers and line count are not secret, and they identify every
          # way this can be wrong without printing any key material.
          echo "--- decoded key ---"
          echo "bytes      : $(wc -c < /tmp/cert_key.pem | tr -d ' ')"
          echo "lines      : $(wc -l < /tmp/cert_key.pem | tr -d ' ')"
          echo "first line : $(head -1 /tmp/cert_key.pem)"
          echo "last line  : $(tail -1 /tmp/cert_key.pem)"

          if ! head -1 /tmp/cert_key.pem | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo ""
            echo "ERROR: that is not a PKCS#1 PEM private key."
            echo "If the first line says OPENSSH, regenerate with -m PEM."
            exit 1
          fi

          keychain initialize

          # --create makes the distribution certificate and the profiles
          # if they are absent, which on a fresh account they are. Both
          # the container app AND the extension need their own profile:
          # the extension is a separately signed binary.
          # --certificate-key is required for --create: Apple issues a
          # certificate against a signing request, and the request has to
          # be generated from a private key. Without it the CLI can fetch
          # existing certificates but cannot make one, which on a fresh
          # account means it can do nothing.
          #
          # The same key must be reused on every build. A new key each
          # time would mean a new certificate each time, and Apple caps
          # distribution certificates at three.
          app-store-connect fetch-signing-files "$BUNDLE_ID_CONTAINER" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          app-store-connect fetch-signing-files "$BUNDLE_ID_AUV3" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create

          keychain add-certificates
          xcode-project use-profiles

      - name: Report what was signed with
        script: |
          # If the archive step fails later, this shows whether the
          # profiles were actually obtained and which IDs they cover.
          echo "--- provisioning profiles ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none)"
          echo "--- signing identities ---"
          security find-identity -v -p codesigning 2>/dev/null | head || echo "(none)"

      - name: Build and archive
        script: |
          xcode-project build-ipa \
            --project "build-ios/ExpressionSynth.xcodeproj" \
            --scheme "ExpressionSynth_Standalone" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

      - name: Validate the ipa before it is uploaded
        script: |
          # Apple validates at UPLOAD, which happens after every script
          # has run - so a plist fault costs the entire signing round trip
          # before it surfaces. This inspects the archive that is about to
          # be sent, which is the only thing that actually matters.
          IPA=$(find build -name "*.ipa" | head -1)
          echo "inspecting: $IPA"
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          (cd /tmp/ipacheck && unzip -oq "$OLDPWD/$IPA")
          PLIST=$(find /tmp/ipacheck/Payload -maxdepth 2 -name "Info.plist" | head -1)
          FAIL=0

          FULLSCREEN=$(/usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$PLIST" 2>/dev/null || echo "false")
          echo "UIRequiresFullScreen: $FULLSCREEN"

          for KEY in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~ipad"; do
            COUNT=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" 2>/dev/null | grep -c UIInterface || true)
            echo "$KEY: $COUNT"
            if [ "$FULLSCREEN" != "true" ] && [ "$COUNT" -gt 0 ] && [ "$COUNT" -lt 4 ]; then
              echo "  ERROR: iPad multitasking needs all four orientations."
              FAIL=1
            fi
          done

          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null) build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" 2>/dev/null)"

          [ "$FAIL" -eq 0 ] || exit 1
          echo "ipa looks acceptable for upload."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration

        # False on purpose. True submits for EXTERNAL beta review, which
        # requires a feedback email, a review contact with phone number,
        # and an Apple review taking days. None of that is needed to test
        # it yourself: the build still uploads and processes, and becomes
        # available to internal testers immediately.
        submit_to_testflight: false
